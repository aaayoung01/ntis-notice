<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>NTIS공고</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 40px; background-color: #fff; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; }
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { border-top: 1px solid #ccc; border-bottom: 1px solid #eee; padding: 12px 10px; color: #555; font-size: 14px; font-weight: normal; }
        td { border-bottom: 1px solid #eee; padding: 14px 10px; text-align: center; font-size: 14px; color: #333; }
        td.title { text-align: left; font-weight: 600; color: #111; }
        td.title a { color: #111; text-decoration: none; }
        td.title a:hover { text-decoration: underline; }
        .pagination { text-align: center; margin-top: 30px; }
        .pagination button { padding: 6px 12px; margin: 0 3px; cursor: pointer; border: 1px solid #ddd; background: #fff; border-radius: 4px; font-weight: bold; color: #555; }
        .pagination button:hover { background: #f0f0f0; }
        .pagination button.active { background: #0066cc; color: #fff; border-color: #0066cc; }
    </style>
</head>
<body>

    <h2>NTIS공고</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">번호</th>
                    <th style="width: 12%;">부처명</th>
                    <th style="width: 38%;">공고명</th>
                    <th style="width: 15%;">공고기관명</th>
                    <th style="width: 10%;">공고일</th>
                    <th style="width: 12%;">접수기간</th>
                    <th style="width: 8%;">공고금액</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>

    <script>
        let allData = [];
        let currentPage = 1;
        const itemsPerPage = 50;

        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                allData = data;
                displayTable(currentPage);
                displayPagination();
            })
            .catch(error => console.error('데이터 로드 실패:', error));

        function displayTable(page) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";
            
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = allData.slice(start, end);

            if (paginatedItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="padding: 20px; color: #888;">등록된 공고 데이터가 없습니다.</td></tr>`;
                return;
            }

            paginatedItems.forEach((item, index) => {
                const row = document.createElement('tr');
                const itemNum = allData.length - (start + index);
                
                // 데이터가 없는 경우 하이픈(-)을 빈칸으로 변환
                let amountDisplay = item.amount || "";
                if (amountDisplay === "-") amountDisplay = "";

                let periodDisplay = item.appPeriod || "";
                if (periodDisplay === "-") periodDisplay = "";

                row.innerHTML = `
                    <td>${itemNum}</td>
                    <td>${item.department}</td>
                    <td class="title"><a href="${item.link}" target="_blank">${item.title}</a></td>
                    <td>${item.agency}</td>
                    <td>${item.date}</td>
                    <td>${periodDisplay}</td>
                    <td>${amountDisplay}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function displayPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = "";
            const totalPages = Math.ceil(allData.length / itemsPerPage);
            
            if (totalPages <= 1) return;

            let firstBtn = document.createElement('button');
            firstBtn.innerText = "처음";
            firstBtn.onclick = () => { currentPage = 1; displayTable(currentPage); displayPagination(); };
            pagination.appendChild(firstBtn);

            let prevBtn = document.createElement('button');
            prevBtn.innerText = "이전";
            prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; displayTable(currentPage); displayPagination(); } };
            pagination.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                let pageBtn = document.createElement('button');
                pageBtn.innerText = i;
                if (i === currentPage) pageBtn.classList.add('active');
                pageBtn.onclick = () => { currentPage = i; displayTable(currentPage); displayPagination(); };
                pagination.appendChild(pageBtn);
            }

            let nextBtn = document.createElement('button');
            nextBtn.innerText = "다음";
            nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; displayTable(currentPage); displayPagination(); } };
            pagination.appendChild(nextBtn);

            let lastBtn = document.createElement('button');
            lastBtn.innerText = "끝";
            lastBtn.onclick = () => { currentPage = totalPages; displayTable(currentPage); displayPagination(); };
            pagination.appendChild(lastBtn);
        }
    </script>
</body>
</html>
